version: '3.8'

services:
  apache:
    image: httpd:latest
    container_name: apache
    ports:
      - "8081:80"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8082:80"

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
